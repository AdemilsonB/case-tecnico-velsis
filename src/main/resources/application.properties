spring.application.name=cadastro-usuarios

# Os valores após os dois-pontos são o padrão; variáveis de ambiente permitem
# apontar para outra instalação local sem editar este arquivo
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cadastro_usuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O schema vem do schema.sql; o Hibernate apenas confere a entidade contra ele na subida
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

spring.jpa.open-in-view=false
