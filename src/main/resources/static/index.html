<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <span class="marca">VELSIS</span>
  <span class="sistema">Cadastro de Usuários</span>
</header>

<main>
  <div class="cabecalho">
    <h1>Usuários cadastrados</h1>
    <a href="novo.html"><button type="button" class="btn btn-primario">Novo usuário</button></a>
  </div>

  <div id="faixa" class="faixa" role="status" hidden></div>

  <div class="filtro">
    <input type="text" id="termo" placeholder="Buscar por nome ou documento">
    <button type="button" id="btnBuscar" class="btn btn-primario">Buscar</button>
    <button type="button" id="btnLimpar" class="btn btn-secundario">Limpar</button>
  </div>

  <div id="estado" class="vazio">Carregando...</div>

  <table id="tabela" hidden>
    <thead>
    <tr>
      <th>Nome</th>
      <th>Documento</th>
      <th>Nascimento</th>
      <th>Cidade/UF</th>
      <th class="acao"></th>
    </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

  <div class="paginacao" id="paginacao" hidden>
    <button type="button" class="btn btn-secundario seta" id="btnAnterior">&lsaquo;</button>
    <span class="info" id="indicador"></span>
    <button type="button" class="btn btn-secundario seta" id="btnProxima">&rsaquo;</button>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/feedback.js"></script>
<script>
  const TAMANHO_PAGINA = 20;
  let paginaAtual = 0;
  let termoAtual = '';

  const faixa = document.getElementById('faixa');
  const estado = document.getElementById('estado');
  const tabela = document.getElementById('tabela');
  const corpo = document.getElementById('corpo');
  const paginacao = document.getElementById('paginacao');
  const campoTermo = document.getElementById('termo');

  // Mensagem gravada pela tela de cadastro antes de voltar para cá. É lida uma
  // única vez: sem o remove ela reapareceria a cada recarga da listagem.
  const mensagem = sessionStorage.getItem('mensagemSucesso');
  if (mensagem) {
    sessionStorage.removeItem('mensagemSucesso');
    mostrarSucesso(faixa, mensagem);
  }

  function formatarData(iso) {
    const partes = iso.split('-');
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  function formatarDocumento(documento) {
    return documento.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  }

  function montarLinha(usuario) {
    const tr = document.createElement('tr');
    [usuario.name, formatarDocumento(usuario.document), formatarData(usuario.birthDate),
      usuario.city + '/' + usuario.state].forEach(function (valor) {
      const td = document.createElement('td');
      td.textContent = valor;
      tr.appendChild(td);
    });

    const celula = document.createElement('td');
    celula.className = 'acao';
    const botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'btn btn-editar';
    botao.textContent = 'Editar';
    botao.addEventListener('click', function () {
      window.location.href = 'editar.html?id=' + usuario.id;
    });
    celula.appendChild(botao);
    tr.appendChild(celula);
    return tr;
  }

  function renderizarPaginacao(pagina, totalPaginas, totalRegistros) {
    const sufixo = termoAtual ? ' registros encontrados' : ' registros';
    document.getElementById('indicador').textContent =
      'Página ' + (pagina + 1) + ' de ' + totalPaginas + ' · ' + totalRegistros + sufixo;
    document.getElementById('btnAnterior').disabled = pagina === 0;
    document.getElementById('btnProxima').disabled = pagina >= totalPaginas - 1;
    paginacao.hidden = false;
  }

  async function carregar() {
    estado.textContent = 'Carregando...';
    estado.hidden = false;
    tabela.hidden = true;
    paginacao.hidden = true;

    try {
      const resultado = await api.listar(paginaAtual, TAMANHO_PAGINA, termoAtual);
      paginaAtual = resultado.page;
      corpo.replaceChildren();

      if (resultado.totalElements === 0) {
        estado.textContent = termoAtual
          ? 'Nenhum usuário encontrado para o termo informado.'
          : 'Nenhum usuário cadastrado.';
        return;
      }

      resultado.content.forEach(function (usuario) {
        corpo.appendChild(montarLinha(usuario));
      });
      estado.hidden = true;
      tabela.hidden = false;
      renderizarPaginacao(resultado.page, resultado.totalPages, resultado.totalElements);
    } catch (erro) {
      estado.textContent = erro.message;
      estado.hidden = false;
    }
  }

  function buscar() {
    termoAtual = campoTermo.value.trim();
    paginaAtual = 0; // busca nova sempre volta para a primeira página
    carregar();
  }

  function limpar() {
    campoTermo.value = '';
    termoAtual = '';
    paginaAtual = 0;
    carregar();
  }

  function irParaPagina(numero) {
    paginaAtual = numero; // a paginação preserva o termo buscado
    carregar();
  }

  document.getElementById('btnBuscar').addEventListener('click', buscar);
  document.getElementById('btnLimpar').addEventListener('click', limpar);
  campoTermo.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter') {
      buscar();
    }
  });
  document.getElementById('btnAnterior').addEventListener('click', function () {
    irParaPagina(paginaAtual - 1);
  });
  document.getElementById('btnProxima').addEventListener('click', function () {
    irParaPagina(paginaAtual + 1);
  });

  carregar();
</script>
</body>
</html>
